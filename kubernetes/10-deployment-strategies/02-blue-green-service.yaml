apiVersion: v1
kind: Service
metadata:
  labels:
    name: nginx-service-blue-green
  name: nginx-service-blue-green
  namespace: default
spec:
  selector:
    app: nginx-blue #change this to nginx-green to switch traffic to the green deployment
  ports:
  - name: http
    port: 8080
    targetPort: 80
  type: LoadBalancer