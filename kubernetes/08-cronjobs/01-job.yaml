apiVersion: batch/v1
kind: Job
metadata:
  name: echo-command
spec:
  template:
    spec:
      containers:
      - name: echo-command
        image: alpine
        command: ["echo", "Hello from the Kubernetes cluster"]
      restartPolicy: OnFailure
  ttlSecondsAfterFinished: 120 #Time to remove the job after it has finished.